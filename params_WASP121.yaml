transit:
  t0: 0.0 # time of inferior conjunction
  per: 1.27492504 # orbital period in days
  rp: 0.12252744516353857 # planet radius (in units of stellar radii)
  a: 3.784036086440643 # semi-major axis (in units of stellar radii)
  inc: 88.49 # orbital inclination (in degrees)
  ecc: 0.0085 # eccentricity
  w: 88.95 # longitude of periastron (in degrees)
  u: [0.086066667, 0.1542] # limb darkening coefficients [u1, u2]
  limb_dark: "quadratic" # limb darkening model
classifier:
  type: cnn # [cnn, rf] for Convolutional Neural Network and Random Forest

